name: 💡 Feature Request / Enhancement
description: Suggest an idea or capability for n8n-agy-zero-llm-api
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make this bridge faster, easier to install, or work with more models / operating systems (like macOS / Linux)? We'd love to hear it!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the limitation or challenge is.
      placeholder: I want to use this bridge on Linux / Mac / Docker...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Additional context or alternatives considered
      description: Any other context or screenshots about the feature request here.
